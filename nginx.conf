# Serves the built site. Only two things differ from the nginx default.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Relative redirects, so the /page -> /page/ one keeps whatever host and
    # port the container was published on.
    absolute_redirect off;

    # The vaccination-rate map alone is 2.5 MB of SVG.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/xml;
}
